[package]
name = "gl-sms-testserver"
version = "1.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
if-addrs = "0.15.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
